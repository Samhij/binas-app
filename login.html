<!doctype html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Inloggen op Digitale Binas">
  <title>Inloggen — Digitale Binas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700&display=swap');
    :root {
      color-scheme: light;
      --bg: #e8ecf1;
      --bg-elevated: #f7f8fa;
      --ink: #10141c;
      --muted: #5a6578;
      --line: #c5ccd8;
      --accent: #c43c11;
      --accent-soft: rgba(196, 60, 17, 0.12);
      --accent-ink: #fff8f5;
      --danger: #9b1c1c;
      --header-fade: linear-gradient(180deg, #dfe5ee 0%, transparent 100%);
      --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
      --font-display: Syne, Georgia, serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1016;
      --bg-elevated: #161b24;
      --ink: #eef1f6;
      --muted: #9aa5b8;
      --line: #2a3344;
      --accent: #ff6a35;
      --accent-soft: rgba(255, 106, 53, 0.16);
      --accent-ink: #140800;
      --danger: #ff8f8f;
      --header-fade: linear-gradient(180deg, #141925 0%, transparent 100%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--bg);
      background-image: var(--header-fade);
      background-size: 100% 18rem;
      background-position: top left;
      background-repeat: no-repeat;
      font: 1rem/1.45 var(--font-body);
      display: grid;
      place-items: start center;
      padding: 1.75rem 1rem 4rem;
    }
    .shell {
      width: min(640px, 100%);
    }
    .bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 0.92;
    }
    .theme-toggle {
      flex-shrink: 0;
      margin-top: 0.35rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--bg-elevated);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 160ms ease, border-color 160ms ease;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--ink); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 4vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .lede {
      margin: 0.55rem 0 0;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.02rem;
    }
    form {
      display: grid;
      gap: 0.4rem;
      margin-top: 1.75rem;
    }
    label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.8rem 0.85rem;
      border: 0;
      border-bottom: 2px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      outline: 0;
      font: inherit;
      transition: border-color 160ms ease;
    }
    input::placeholder { color: var(--muted); opacity: 0.75; }
    input:focus { border-bottom-color: var(--accent); }
    button.primary {
      width: fit-content;
      margin-top: 1.25rem;
      padding: 0.85rem 1.35rem;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }
    button.primary:hover:not(:disabled) { transform: translateY(-1px); }
    button.primary:disabled { opacity: 0.55; cursor: wait; }
    button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .error {
      margin-top: 1rem;
      padding: 0.75rem 0;
      border-top: 2px solid var(--danger);
      color: var(--danger);
      font-weight: 550;
      min-height: 0;
    }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="bar">
      <p class="brand">Binas</p>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Wissel thema">Thema</button>
    </div>
    <h1>Inloggen</h1>
    <p class="lede">Voer het wachtwoord in om de tabellen te openen.</p>
    <form id="loginForm">
      <label for="password">Wachtwoord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary" id="loginButton">Inloggen</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </main>
  <script>
    (function () {
      var stored = localStorage.getItem('binas:theme') || 'light';
      document.documentElement.dataset.theme = stored;
      var toggle = document.getElementById('themeToggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          localStorage.setItem('binas:theme', next);
        });
      }
    })();

    fetch('/api/auth', { credentials: 'same-origin' })
      .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok) location.replace('/');
      })
      .catch(function () {});

    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var button = document.getElementById('loginButton');
      var error = document.getElementById('loginError');
      var password = document.getElementById('password').value;
      button.disabled = true;
      error.textContent = '';
      try {
        var response = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });
        var data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          error.textContent = data.error || 'Onjuist wachtwoord.';
          button.disabled = false;
          document.getElementById('password').focus();
          document.getElementById('password').select();
          return;
        }
        location.replace('/');
      } catch (err) {
        error.textContent = 'Kon niet inloggen. Probeer het opnieuw.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
